apiVersion: apps/v1
kind: Deployment
metadata:
  name: jeff
  labels:
    app: jeff
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jeff
  template:
    metadata:
      labels:
        app: jeff
    spec:
      containers:
        - name: jeff
          image: jeff:latest
          ports:
            - containerPort: 8000
          env:
            - name: JEFF_CHECKPOINT
              value: /app/checkpoints/jeff-0.8b
            - name: JEFF_API_KEY
              valueFrom:
                secretKeyRef:
                  name: jeff-api-key
                  key: key
                  optional: true
          volumeMounts:
            - name: checkpoints
              mountPath: /app/checkpoints
              readOnly: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              memory: 5Gi
              cpu: "2"
            limits:
              memory: 6Gi
      volumes:
        - name: checkpoints
          persistentVolumeClaim:
            claimName: jeff-checkpoints
---
apiVersion: v1
kind: Service
metadata:
  name: jeff
spec:
  selector:
    app: jeff
  ports:
    - port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jeff-checkpoints
spec:
  accessModes:
    - ReadOnlyMany
  resources:
    requests:
      storage: 5Gi
